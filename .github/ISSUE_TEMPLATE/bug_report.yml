name: Bug report
description: Report a reproducible problem in Favicon Kit.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence and input details.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Provide the browser name and exact version.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the expected result.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Add relevant screenshots or sanitized console output.
    validations:
      required: false
